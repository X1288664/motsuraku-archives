    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ページが見つかりません - もつ楽アーカイブ</title>
    
    <link rel="icon" href="favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* アーカイブ用404ページ専用スタイル */
        :root {
            --bg-color: #f4f6f9;
            --text-color: #333;
            --accent-color: #007bff;
            --header-bg: #ffffff;
            --footer-bg: #f9f9f9;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --text-color: #e0e0e0;
                --header-bg: #1f1f1f;
                --footer-bg: #1a1a1a;
            }
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ヘッダー簡易版 */
        header {
            background-color: var(--header-bg);
            padding: 15px 20px;
            border-bottom: 1px solid rgba(128,128,128,0.2);
            text-align: center;
        }
        .site-title {
            margin: 0;
            font-size: 1.2rem;
            font-weight: bold;
            color: inherit;
            text-decoration: none;
        }

        /* メインコンテンツ */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .error-container {
            max-width: 800px;
            text-align: center;
            background: var(--header-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .error-image {
            max-width: 80%;      /* 横幅は親要素の80%まで */
            height: auto;        /* 縦横比を維持 */
            max-height: 300px;   /* 高くなりすぎないように制限 */
            margin-bottom: 20px; /* タイトルとの間に隙間を空ける */
            border-radius: 8px;  /* 少し角を丸くする（お好みで） */
        }

        /* ダークモード時に画像を少し暗くして馴染ませる（任意） */
        @media (prefers-color-scheme: dark) {
            .error-image {
                opacity: 0.85;
            }
        }

        .error-title {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: var(--accent-color);
        }
        
        .error-text {
            margin-bottom: 30px;
            line-height: 1.6;
            color: #888;
        }

        /* ボタン */
        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: #fff;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.8; }
        
        .btn-sub {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid #888;
            margin-left: 10px;
        }

        /* フッター */
        footer {
            background-color: var(--footer-bg);
            padding: 20px;
            text-align: center;
            font-size: 0.8rem;
            color: #888;
            border-top: 1px solid rgba(128,128,128,0.1);
        }
        footer a { color: var(--accent-color); text-decoration: none; }
    </style>
</head>

<body>
    <header>
        <a href="index.html" class="site-title">もつ楽アーカイブ (Project A.T.L.A.S Library)</a>
        <button id="theme-toggle" class="theme-btn" aria-label="ダークモード切替">
        🌙
        </button>
    </header>

    <main>
        <div class="error-container">
            <h1 class="error-title">404 Not Found</h1>
            <img src="image/404-arch.png" alt="ページが見つかりません" class="error-image">
            <p class="error-text">
                お探しのページ（ファイル）はアーカイブ内に存在しないか、<br>
                パスが変更されている可能性があります。<br>
                <br>
                ここは過去のバージョンを保存するアーカイブサイトです。<br>
                最新の情報をお探しの場合は公式サイトをご覧ください。
            </p>
            
            <div class="actions">
                <a href="index.html" class="btn">アーカイブ一覧へ戻る</a>
                <a href="https://x1288664.github.io/zunda0924-motsuraku.github.io/" class="btn btn-sub">公式サイトへ行く</a>
            </div>
        </div>
    </main>

    <footer>
        <p>
            &copy; 2025 STUDIO MARX / Motsuraku Archives<br>
            <a href="https://x1288664.github.io/zunda0924-motsuraku.github.io/">Official Site Main Page</a>
        </p>
    </footer>
<script src="JavaScript/scripts.js"></script>
</body>
</html>
